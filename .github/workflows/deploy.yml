name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      # `.node-version` is a workspace link into `../tabjs`, so a checkout of
      # this repository alone carries a dangling symlink and cannot be read.
      # `package.json` is committed here, and setup-node reads `engines.node`
      # from it, which is the same major the link points at.
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
