<text x="52" y="616" font-family="IBM Plex Sans, Helvetica Neue, Arial, PingFang SC, Hiragino Sans GB, Noto Sans SC, sans-serif" font-size="16" font-weight="400" fill="#6b746f" text-anchor="start">B9 to B12 (945, 1374, 1614, 2202 nm) lie beyond this axis.</text>
<text x="740" y="164" font-family="IBM Plex Sans, Helvetica Neue, Arial, PingFang SC, Hiragino Sans GB, Noto Sans SC, sans-serif" font-size="21" font-weight="600" fill="#202522" text-anchor="start">From integrals to a photograph</text>
<text x="740" y="190" font-family="IBM Plex Sans, Helvetica Neue, Arial, PingFang SC, Hiragino Sans GB, Noto Sans SC, sans-serif" font-size="17" font-weight="400" fill="#6b746f" text-anchor="start">Only the middle step is not a choice.</text>
<text x="740" y="226" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="500" fill="#202522" text-anchor="start">13 band averages</text>
