<line x1="740" y1="264" x2="1150" y2="264" stroke="#e2e6e3" stroke-width="1"/>
<text x="740" y="294" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="500" fill="#202522" text-anchor="start">3 x 13 matrix</text>
<text x="740" y="317" font-family="IBM Plex Sans, Helvetica Neue, Arial, PingFang SC, Hiragino Sans GB, Noto Sans SC, sans-serif" font-size="15.5" font-weight="400" fill="#6b746f" text-anchor="start">fitted to spectra, never measured</text>
<line x1="740" y1="332" x2="1150" y2="332" stroke="#e2e6e3" stroke-width="1"/>
<text x="740" y="362" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="500" fill="#202522" text-anchor="start">XYZ, D65</text>
<text x="740" y="385" font-family="IBM Plex Sans, Helvetica Neue, Arial, PingFang SC, Hiragino Sans GB, Noto Sans SC, sans-serif" font-size="15.5" font-weight="400" fill="#6b746f" text-anchor="start">the standard enters here</text>
<line x1="740" y1="400" x2="1150" y2="400" stroke="#e2e6e3" stroke-width="1"/>
<text x="740" y="430" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="500" fill="#202522" text-anchor="start">3 x 3 sRGB matrix</text>
<text x="740" y="453" font-family="IBM Plex Sans, Helvetica Neue, Arial, PingFang SC, Hiragino Sans GB, Noto Sans SC, sans-serif" font-size="15.5" font-weight="400" fill="#6b746f" text-anchor="start">already inside every display</text>
