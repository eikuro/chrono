# yaml-language-server: $schema=../porter/schemas/manifest.json
---
#
# component metadata
#
type: docs
private: true

github: "eikuro"
name: chrono
description: Engineering blog.

languages:
  - markdown
  - typescript

pipeline: .github/workflows/ci.yml

agents: ../.agents

#
# component repo config
#

# Every shared config file is a link: locally it points into `../jsmap`, and a
# clean checkout materialises a real copy through `--ci`. The workflow checks
# the bases out beside this repository and runs `porter config --ci` before the
# gates read anything, so nothing here is committed as a real file.
config:
  base: ../jsmap

  # linked locally; a clean checkout materialises real copies with --ci — these
  # are the files `setup-node`, `pnpm install`, and `prettier --check` read
  ci:
    - .node-version
    - .npmrc
    - .prettierignore
    - .prettierrc.yaml

  # linked locally, untracked: only a developer's editor or a local tool reads
  # these, so a clean checkout needs none of them
  local:
    - .editorconfig
    - .markdownlint.yaml
    - .vscode
    - cspell.config.yaml

  # `.gitignore` is a managed output in template mode: the shared body above
  # the `# Repo-specific Entries` boundary refreshes from jsmap, while the
  # entries below that boundary are this repository's own — declared here, so
  # the whole file is reproducible from this manifest alone. The boundary is
  # declared with an empty tail because no shared config file is a real copy
  # here, so there is nothing to re-include below it.
  .gitignore: | #ini
    #
    ##   Repo-specific Entries
    #

  .gitattributes: []

  # the workflow file stays a copied key, never a `ci:` entry: a pipeline
  # cannot materialise the file that starts it
  .github/workflows/ci.yml: []
