# yaml-language-server: $schema=../porter/schemas/manifest.json
---
#
# component metadata
#
type: template
private: true

github: "eikuro"
name: chrono
description: Engineering blog.

languages:
  - markdown
  - typescript

pipeline: .github/workflows/ci.yml

agents: ../.agents

#
# component repo config
#

# `pnpm run check` runs prettier in CI, and the workflow checks out this
# repository alone — with no base beside it, Porter cannot re-materialise what
# the gate reads — so those files stay copied and tracked. Every other shared
# config file is linked locally and untracked.
config:
  base: ../jsmap

  local:
    - .cspell
    - .editorconfig
    - .markdownlint.yaml
    - .vscode
    - cspell.config.yaml

  # the key's presence — not its content — registers .gitignore as a managed
  # output, so the shared rules above the `# Repo-specific Entries` boundary
  # keep refreshing from jsmap; entries below that boundary survive
  # `porter config` verbatim, so a rule declared both here and below is
  # appended twice — keep each rule in exactly one place
  .gitignore: []

  .gitattributes: []

  # read by the CI gate, not by an editor
  .github/workflows/ci.yml: []
  .node-version: []
  .npmrc: []
  .prettierignore: []
  .prettierrc.yaml: []
